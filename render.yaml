# Render blueprint for the API. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: courselens-api
    runtime: node
    region: frankfurt # same region as the MongoDB Atlas cluster
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: TRUST_PROXY
        value: '2'
      # Loads the demo catalog on first start; does nothing once the database has data.
      - key: SEED_IF_EMPTY
        value: 'true'
      # Files are kept in MongoDB GridFS unless CLOUDINARY_URL is set (Render's free disk is wiped on restart).
      - key: STORAGE
        value: gridfs
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://courselens.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: courselens/prod
